<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#15100c" />
<title>Баны устройств · Серп</title>
<link rel="icon" type="image/png" href="/favicon.png?v=4" />
<style>
  :root {
    --bg: #15100c; --bg2: #1e1611; --card: #241a13; --line: #3a2c20;
    --txt: #f3e9df; --muted: #a08b78; --ember: #ff7a18; --ember2: #ffb347;
    --ok: #4cc9a0; --danger: #ff4d4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt); min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    padding: calc(22px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(60px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; line-height: 1.5; }
  .warn {
    border: 1px solid var(--line); border-left: 3px solid var(--ember2);
    background: rgba(255,179,71,.08); border-radius: 10px; padding: 10px 12px;
    color: var(--ember2); font-size: 13px; line-height: 1.5; margin: 0 0 16px;
  }
  h2 { font-size: 15px; margin: 20px 0 10px; color: var(--muted); font-weight: 600; }
  .row {
    border: 1px solid var(--line); border-radius: 14px; padding: 12px;
    background: var(--card); display: flex; gap: 10px; align-items: center; margin-bottom: 10px;
  }
  .row .body { flex: 1 1 auto; min-width: 0; }
  .row .t { font-size: 15px; font-weight: 600; }
  .row .m { color: var(--muted); font-size: 12.5px; margin-top: 3px; line-height: 1.5; word-break: break-all; }
  .row .left { color: var(--ember2); font-weight: 600; }
  button {
    font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--line);
  }
  .unban {
    flex: 0 0 auto; padding: 10px 14px; background: none; color: var(--ok);
    border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); font-weight: 600;
  }
  .unban:active { background: rgba(76,201,160,.12); }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn {
    padding: 12px 16px; background: var(--bg2); color: var(--txt); font-weight: 600;
  }
  .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
  .btn.primary { background: var(--ember); color: #14100b; border-color: var(--ember); }
  .msg { color: var(--muted); font-size: 13px; margin-top: 12px; min-height: 18px; }
  .msg.err { color: var(--danger); }
  a.back { color: var(--ember2); font-size: 13px; text-decoration: none; }
  /* вход по ПИН */
  #pinGate { max-width: 340px; margin: 40px auto 0; }
  input {
    background: var(--bg2); border: 1px solid var(--line); border-radius: 10px;
    color: var(--txt); font-size: 16px; line-height: 1.4; font-family: inherit; padding: 12px; width: 100%; margin: 10px 0;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <!-- Вход по ПИН админа -->
    <div id="pinGate" class="hidden">
      <h1>Баны устройств</h1>
      <p class="sub" id="pinMsg">Введите ПИН администратора.</p>
      <input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="ПИН" />
      <button class="btn primary" id="pinGo" style="width:100%">Войти</button>
    </div>

    <!-- Список банов -->
    <div id="panel" class="hidden">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <h1>🚫 Баны устройств</h1>
        <a class="back" href="/pult/">← в пульт</a>
      </div>
      <p class="sub">Бан ставится кнопкой 🚫 на вызове в пульте: устройство — на сутки, его IP — на час.
        Здесь их видно и можно снять вручную.</p>
      <div id="enforceWarn" class="warn hidden"></div>

      <h2>📱 Устройства <span id="didCount" class="muted"></span></h2>
      <div id="dids"></div>

      <h2>🌐 IP-адреса <span id="ipCount" class="muted"></span></h2>
      <div id="ips"></div>

      <div class="actions">
        <button class="btn" id="refresh">↻ Обновить</button>
        <button class="btn danger" id="clearAll">Снять все баны</button>
      </div>
      <p class="msg" id="msg"></p>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const getKey = () => localStorage.getItem("serp.key") || "";
  const H = () => ({ "X-Pult-Key": getKey() });
  const esc = (s) => String(s == null ? "" : s).replace(/[<>&"']/g, (c) =>
    ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;", "'": "&#39;" }[c]));

  function human(ms) {
    const m = Math.max(0, Math.round(ms / 60000));
    if (m < 60) return m + " мин";
    return Math.floor(m / 60) + " ч " + (m % 60) + " мин";
  }
  function hhmm(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  function say(t, err) { const m = $("msg"); m.textContent = t || ""; m.className = "msg" + (err ? " err" : ""); }

  function rowHTML(b, kind, now) {
    const who = b.table ? "Стол " + b.table : "неизвестный стол";
    const dev = b.dev ? " · " + esc(b.dev) : "";
    const last = b.lastTs ? " · последний вызов в " + hhmm(b.lastTs) : "";
    const id = kind === "did" ? b.did : b.ip;
    const idLabel = kind === "did" ? ("устройство " + id.slice(0, 8) + "…") : ("IP " + esc(id));
    return `<div class="row">
      <div class="body">
        <div class="t">${esc(who)}${dev}</div>
        <div class="m"><span class="left">осталось ${human(b.until - now)}</span>${last}</div>
        <div class="m">${idLabel}</div>
      </div>
      <button class="unban" data-kind="${kind}" data-id="${esc(id)}">Разбанить</button>
    </div>`;
  }

  async function load() {
    try {
      const r = await fetch("/api/bans", { headers: H() });
      if (r.status === 401) { showGate("Сессия истекла — введите ПИН ещё раз."); return; }
      if (r.status === 403) { showGate("Нужен ПИН администратора."); return; }
      const d = await r.json();
      if (!d.ok) { say(d.error || "Не получилось", true); return; }
      const w = $("enforceWarn");
      if (!d.enforced) {
        w.classList.remove("hidden");
        w.textContent = "⚠️ Сейчас лимиты и баны ВЫКЛЮЧЕНЫ (limits:false) — эти записи не действуют, вызовы проходят от всех. Список ведётся на будущее.";
      } else w.classList.add("hidden");

      $("didCount").textContent = d.dids.length ? "· " + d.dids.length : "";
      $("ipCount").textContent = d.ips.length ? "· " + d.ips.length : "";
      $("dids").innerHTML = d.dids.length
        ? d.dids.map((b) => rowHTML(b, "did", d.now)).join("")
        : `<div class="empty">Забаненных устройств нет.</div>`;
      $("ips").innerHTML = d.ips.length
        ? d.ips.map((b) => rowHTML(b, "ip", d.now)).join("")
        : `<div class="empty">Забаненных IP нет.</div>`;
    } catch { say("Нет связи с сервером.", true); }
  }

  async function unban(body, okText) {
    say("Снимаю…");
    try {
      const r = await fetch("/api/unban", { method: "POST",
        headers: { "Content-Type": "application/json", ...H() }, body: JSON.stringify(body) });
      if (r.status === 401) { showGate("Сессия истекла — введите ПИН ещё раз."); return; }
      const d = await r.json();
      if (!d.ok) { say(d.error || "Не получилось", true); return; }
      await load();
      say(okText || ("Снято: " + d.removed));
    } catch { say("Нет связи с сервером.", true); }
  }

  $("dids").addEventListener("click", (e) => {
    const b = e.target.closest("[data-kind]"); if (!b) return;
    unban({ did: b.dataset.id }, "Устройство разбанено ✓");
  });
  $("ips").addEventListener("click", (e) => {
    const b = e.target.closest("[data-kind]"); if (!b) return;
    unban({ ip: b.dataset.id }, "IP разбанен ✓");
  });
  $("refresh").addEventListener("click", () => { say(""); load(); });
  let clearArm = 0;
  $("clearAll").addEventListener("click", () => {
    const btn = $("clearAll");
    if (Date.now() < clearArm) { clearArm = 0; btn.textContent = "Снять все баны"; unban({ all: true }, "Все баны сняты ✓"); return; }
    clearArm = Date.now() + 3000; btn.textContent = "Точно? Нажмите ещё раз";
    setTimeout(() => { if (Date.now() > clearArm) { clearArm = 0; btn.textContent = "Снять все баны"; } }, 3200);
  });

  /* ---- вход по ПИН админа; токен общий с пультом на этом устройстве ---- */
  function showGate(msg) {
    $("panel").classList.add("hidden");
    $("pinGate").classList.remove("hidden");
    if (msg) $("pinMsg").textContent = msg;
    $("pin").focus();
  }
  function openPanel() {
    $("pinGate").classList.add("hidden");
    $("panel").classList.remove("hidden");
    load();
  }
  $("pinGo").addEventListener("click", async () => {
    const pin = $("pin").value.trim();
    if (!pin) return;
    $("pinMsg").textContent = "Проверяю…";
    try {
      const d = await (await fetch("/api/login", { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin }) })).json();
      if (!d.ok) { $("pinMsg").textContent = d.error || "Не получилось войти"; return; }
      if (d.role !== "admin") { $("pinMsg").textContent = "Этот ПИН не админский — баны только для админа."; return; }
      localStorage.setItem("serp.key", d.token);
      localStorage.setItem("serp.me", JSON.stringify({ name: d.name, role: d.role }));
      $("pin").value = "";
      openPanel();
    } catch { $("pinMsg").textContent = "Нет связи с сервером"; }
  });
  $("pin").addEventListener("keydown", (e) => { if (e.key === "Enter") $("pinGo").click(); });

  /* старт: уже есть админский вход на этом устройстве — сразу в панель */
  (async () => {
    if (!getKey()) { showGate(); return; }
    try {
      const r = await fetch("/api/me", { headers: H() });
      if (r.status === 401) { showGate(); return; }
      const d = await r.json();
      if (d.ok && d.role === "admin") openPanel();
      else showGate("Вы вошли как сотрудник. Баны — только по ПИНу админа.");
    } catch { showGate("Нет связи с сервером."); }
  })();
</script>
<script src="nav.js?v=7" defer></script>
</body>
</html>
